<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Evolution</title>
<style>
  :root {
    --bg: #0B0C10;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --violet: #b026ff;
    --green: #39ff14;
    --text: #e6f7ff;
    --muted: #7d8aa3;
    --glass: rgba(18, 20, 30, 0.62);
    --edge: rgba(0, 240, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
  }
  .glass {
    background: var(--glass);
    border: 1px solid var(--edge);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 14px;
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.08), inset 0 0 0 1px rgba(255,255,255,0.03);
  }

  /* ---------- Stats panel ---------- */
  .panel {
    position: fixed; top: 16px; left: 16px;
    width: 270px; padding: 16px 18px;
  }
  .title {
    margin: 0 0 12px;
    font-size: 1.05rem; font-weight: 800; letter-spacing: 0.18em;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.45));
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .stat .label {
    font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .stat .value {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .stat .value.cyan { color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6); }
  .stat .value.magenta { color: var(--magenta); text-shadow: 0 0 10px rgba(255,43,214,0.6); }
  .stat .value.green { color: var(--green); text-shadow: 0 0 10px rgba(57,255,20,0.5); }

  .progress-wrap { margin-top: 14px; }
  .progress-head {
    display: flex; justify-content: space-between;
    font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-head span:last-child { font-family: ui-monospace, Consolas, monospace; letter-spacing: 0; }
  .progress {
    height: 8px; border-radius: 99px; overflow: hidden;
    background: rgba(255,255,255,0.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .progress-bar {
    height: 100%; width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 12px rgba(255, 43, 214, 0.7);
  }
  .chart-label {
    margin-top: 14px; margin-bottom: 4px;
    font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  #chart { position: static; width: 100%; height: 54px; cursor: default; }

  /* ---------- Buttons ---------- */
  .corner {
    position: fixed; top: 16px; right: 16px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    color: var(--text); text-decoration: none;
    font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
  }
  .corner:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 179, 71, 0.6);
    box-shadow: 0 0 22px rgba(255, 179, 71, 0.3);
  }
  .corner .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ffb347; box-shadow: 0 0 10px #ffb347;
  }
  .controls {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 8px; padding: 8px;
  }
  .btn {
    padding: 8px 14px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .btn:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,240,255,0.35); }
  .btn.danger:hover { border-color: var(--magenta); box-shadow: 0 0 14px rgba(255,43,214,0.35); }
  .hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    padding: 9px 16px; font-size: 0.8rem; color: var(--muted); white-space: nowrap;
  }
  .hint b { color: var(--text); font-weight: 600; }

  /* ---------- Generation toast ---------- */
  .toast {
    position: fixed; top: 22px; left: 50%;
    transform: translate(-50%, -20px);
    padding: 10px 20px; font-size: 0.9rem; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s, transform 0.35s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .gen { color: var(--cyan); }
  .toast .hit { color: var(--green); }

  @media (max-width: 760px) {
    .panel { width: auto; right: 16px; padding: 12px 14px; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat .value { font-size: 1rem; }
    #chart, .chart-label { display: none; }
    .corner { top: auto; bottom: 72px; right: 16px; }
    .hint { display: none; }
    .controls { left: 16px; justify-content: center; flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <canvas id="world"></canvas>
  <div class="vignette"></div>

  <div class="panel glass">
    <h1 class="title">NEON EVOLUTION</h1>
    <div class="stats">
      <div class="stat"><div class="label">Generation</div><div class="value cyan" id="gen">1</div></div>
      <div class="stat"><div class="label">Best Fitness</div><div class="value magenta" id="best">0.0</div></div>
      <div class="stat"><div class="label">Reached</div><div class="value green" id="reached">0</div></div>
      <div class="stat"><div class="label">Alive</div><div class="value" id="alive">0</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-head"><span>Generation timer</span><span id="timer">0.0s</span></div>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
    </div>
    <div class="chart-label">Best fitness per generation</div>
    <canvas id="chart"></canvas>
  </div>

  <a class="corner glass" href="sand.html"><span class="dot"></span>Play Falling Sand</a>

  <div class="hint glass">
    <b>Drag</b> to draw walls · <b>Right-drag</b> to erase · <b>Space</b> pause · <b>C</b> clear · <b>R</b> restart
  </div>

  <div class="controls glass">
    <button class="btn" id="speedBtn">Speed 1×</button>
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn danger" id="clearBtn">Clear walls</button>
    <button class="btn danger" id="resetBtn">Restart AI</button>
  </div>

  <div class="toast glass" id="toast"></div>

<script>
(() => {
  // ================= Configuration =================
  const WW = 1600, WH = 900;          // logical world size (scaled to fit the screen)
  const POP = 300;                    // agents per generation
  const LIFE = 330;                   // simulation steps per generation (5.5 s at 60 steps/s)
  const STEP_DT = 1 / 60;
  const MAX_FORCE = 0.45;             // magnitude of each gene's thrust vector
  const MAX_SPEED = 7;
  const MUTATION = 0.012;             // chance each gene is replaced with a random one
  const ELITES = 4;                   // best agents copied unchanged into the next generation
  const WALL_HALF = 6;                // half-thickness of walls for collisions
  const AGENT_R = 2;

  const START = { x: WW / 2, y: WH - 60 };
  const TARGET = { x: WW / 2, y: 90, r: 24 };
  const START_DIST = Math.hypot(START.x - TARGET.x, START.y - TARGET.y);

  // ================= Population state =================
  // Each genome is LIFE thrust vectors stored as [x0, y0, x1, y1, ...]
  let genes = [];
  const px = new Float32Array(POP), py = new Float32Array(POP);
  const ox = new Float32Array(POP), oy = new Float32Array(POP);  // previous position (for trails)
  const vx = new Float32Array(POP), vy = new Float32Array(POP);
  const state = new Uint8Array(POP);      // 0 alive, 1 crashed, 2 reached target
  const minDist = new Float32Array(POP);
  const reachStep = new Int32Array(POP);
  const fitness = new Float64Array(POP);

  let generation = 1, step = 0, reachedCount = 0;
  let bestScore = 0, allTimeBest = 0;
  const history = [];

  function randomGene(g, k) {
    const a = Math.random() * Math.PI * 2;
    g[2 * k] = Math.cos(a) * MAX_FORCE;
    g[2 * k + 1] = Math.sin(a) * MAX_FORCE;
  }
  function randomGenome() {
    const g = new Float32Array(LIFE * 2);
    for (let k = 0; k < LIFE; k++) randomGene(g, k);
    return g;
  }

  function spawn() {
    for (let i = 0; i < POP; i++) {
      px[i] = ox[i] = START.x; py[i] = oy[i] = START.y;
      vx[i] = vy[i] = 0;
      state[i] = 0;
      minDist[i] = START_DIST;
      reachStep[i] = LIFE;
    }
    step = 0;
    reachedCount = 0;
  }

  function resetAI() {
    genes = Array.from({ length: POP }, randomGenome);
    generation = 1; bestScore = 0; allTimeBest = 0;
    history.length = 0;
    spawn();
    trailClear = true;
  }

  // ================= Walls =================
  // Line segments drawn by the user: {x1, y1, x2, y2}
  let walls = [];
  function defaultWalls() {
    walls = [{ x1: 560, y1: 470, x2: 1040, y2: 470 }];
  }

  function distToSegSq(x, y, s) {
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const len = dx * dx + dy * dy;
    let t = len ? ((x - s.x1) * dx + (y - s.y1) * dy) / len : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = s.x1 + t * dx - x, cy = s.y1 + t * dy - y;
    return cx * cx + cy * cy;
  }

  const HIT_SQ = (WALL_HALF + AGENT_R) ** 2;
  function hitsWall(x, y) {
    for (let w = 0; w < walls.length; w++) {
      const s = walls[w];
      // cheap bounding-box reject before the exact test
      if (x < Math.min(s.x1, s.x2) - 10 || x > Math.max(s.x1, s.x2) + 10 ||
          y < Math.min(s.y1, s.y2) - 10 || y > Math.max(s.y1, s.y2) + 10) continue;
      if (distToSegSq(x, y, s) < HIT_SQ) return true;
    }
    return false;
  }

  // ================= Physics step =================
  function simulate() {
    const k2 = step * 2;
    for (let i = 0; i < POP; i++) {
      if (state[i] !== 0) continue;
      const g = genes[i];
      ox[i] = px[i]; oy[i] = py[i];
      vx[i] += g[k2]; vy[i] += g[k2 + 1];
      const sp = Math.hypot(vx[i], vy[i]);
      if (sp > MAX_SPEED) { vx[i] *= MAX_SPEED / sp; vy[i] *= MAX_SPEED / sp; }
      px[i] += vx[i]; py[i] += vy[i];

      if (px[i] < 0 || px[i] > WW || py[i] < 0 || py[i] > WH || hitsWall(px[i], py[i])) {
        state[i] = 1;
        continue;
      }
      const d = Math.hypot(px[i] - TARGET.x, py[i] - TARGET.y);
      if (d < minDist[i]) minDist[i] = d;
      if (d < TARGET.r) {
        state[i] = 2;
        reachStep[i] = step;
        minDist[i] = 0;
        reachedCount++;
      }
    }
    step++;

    let alive = 0;
    for (let i = 0; i < POP; i++) if (state[i] === 0) alive++;
    if (step >= LIFE || alive === 0) evolve();
  }

  // ================= Genetic algorithm =================
  // Score shown in the UI: 0-100 for how close the agent got, up to 150 if it reached
  // the target (faster arrivals earn more).
  function scoreOf(i) {
    if (state[i] === 2) return 100 + 50 * (1 - reachStep[i] / LIFE);
    return 100 * Math.max(0, 1 - minDist[i] / START_DIST);
  }

  function evolve() {
    // 1. Evaluate fitness
    let total = 0;
    bestScore = 0;
    for (let i = 0; i < POP; i++) {
      const s = scoreOf(i);
      if (s > bestScore) bestScore = s;
      let f = Math.pow(s / 100, 4);          // sharpen: small gains near the goal matter a lot
      if (state[i] === 1) f *= 0.5;          // crashing is penalised
      fitness[i] = f;
      total += f;
    }
    allTimeBest = Math.max(allTimeBest, bestScore);
    history.push(bestScore);
    if (history.length > 60) history.shift();
    showToast(generation, reachedCount);

    // 2. Elitism: keep the very best genomes as-is
    const order = Array.from({ length: POP }, (_, i) => i).sort((a, b) => fitness[b] - fitness[a]);
    const next = [];
    for (let e = 0; e < ELITES; e++) next.push(genes[order[e]].slice());

    // 3. Roulette-wheel selection over cumulative fitness
    const cumulative = new Float64Array(POP);
    let acc = 0;
    for (let i = 0; i < POP; i++) { acc += fitness[i]; cumulative[i] = acc; }
    function pick() {
      if (total <= 0) return genes[(Math.random() * POP) | 0];
      const r = Math.random() * total;
      let lo = 0, hi = POP - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cumulative[mid] < r) lo = mid + 1; else hi = mid;
      }
      return genes[lo];
    }

    // 4. Crossover + mutation
    while (next.length < POP) {
      const a = pick(), b = pick();
      const child = new Float32Array(LIFE * 2);
      const cut = ((Math.random() * LIFE) | 0) * 2;   // single-point crossover
      child.set(a.subarray(0, cut), 0);
      child.set(b.subarray(cut), cut);
      for (let k = 0; k < LIFE; k++) if (Math.random() < MUTATION) randomGene(child, k);
      next.push(child);
    }

    genes = next;
    generation++;
    spawn();
  }

  // ================= Rendering =================
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  let dpr = 1, scale = 1, offX = 0, offY = 0, trailClear = true;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    scale = Math.min(innerWidth / WW, innerHeight / WH);
    offX = (innerWidth - WW * scale) / 2;
    offY = (innerHeight - WH * scale) / 2;
    trailClear = true;
    resizeChart();
  }
  window.addEventListener('resize', resize);

  function worldTransform() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  }

  function render(time) {
    // Fade the previous frame instead of clearing: this leaves light trails behind agents
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = trailClear ? '#0B0C10' : 'rgba(11, 12, 16, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    trailClear = false;

    worldTransform();

    // Arena border
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, WW - 2, WH - 2);

    // Start pad
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(START.x, START.y, 14, 0, Math.PI * 2); ctx.stroke();

    // Pulsating target
    const pulse = 0.5 + 0.5 * Math.sin(time / 260);
    const glowR = TARGET.r * (2.6 + pulse * 1.4);
    const grad = ctx.createRadialGradient(TARGET.x, TARGET.y, 0, TARGET.x, TARGET.y, glowR);
    grad.addColorStop(0, 'rgba(57, 255, 20, 0.9)');
    grad.addColorStop(0.35, 'rgba(57, 255, 20, 0.35)');
    grad.addColorStop(1, 'rgba(57, 255, 20, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(TARGET.x, TARGET.y, glowR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(200, 255, 190, ${0.6 + pulse * 0.4})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(TARGET.x, TARGET.y, TARGET.r * (0.8 + pulse * 0.25), 0, Math.PI * 2); ctx.stroke();

    // Walls: violet glow with a bright core
    if (walls.length) {
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (const s of walls) { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
      ctx.shadowColor = '#b026ff';
      ctx.shadowBlur = 22;
      ctx.strokeStyle = 'rgba(176, 38, 255, 0.9)';
      ctx.lineWidth = WALL_HALF * 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(245, 225, 255, 0.95)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Agents: additive blending makes overlapping trails glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const groups = [
      { color: 'rgba(0, 240, 255, 0.85)',  glow: 'rgba(0, 240, 255, 0.10)',  parity: 0 },
      { color: 'rgba(255, 43, 214, 0.85)', glow: 'rgba(255, 43, 214, 0.10)', parity: 1 },
    ];
    for (const grp of groups) {
      // trail segment for this step
      ctx.strokeStyle = grp.color;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      for (let i = ELITES + grp.parity; i < POP; i += 2) {
        if (state[i] !== 0) continue;
        ctx.moveTo(ox[i], oy[i]); ctx.lineTo(px[i], py[i]);
      }
      ctx.stroke();
      // soft halo around each head
      ctx.fillStyle = grp.glow;
      ctx.beginPath();
      for (let i = ELITES + grp.parity; i < POP; i += 2) {
        if (state[i] === 1) continue;
        ctx.moveTo(px[i] + 7, py[i]); ctx.arc(px[i], py[i], 7, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    // Elites (last generation's champions) shine white
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < ELITES; i++) {
      if (state[i] !== 0) continue;
      ctx.moveTo(ox[i], oy[i]); ctx.lineTo(px[i], py[i]);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < ELITES; i++) {
      if (state[i] === 1) continue;
      ctx.moveTo(px[i] + 9, py[i]); ctx.arc(px[i], py[i], 9, 0, Math.PI * 2);
    }
    ctx.fill();
    // Crash sparks
    ctx.fillStyle = 'rgba(255, 90, 120, 0.35)';
    ctx.beginPath();
    for (let i = 0; i < POP; i++) {
      if (state[i] !== 1) continue;
      ctx.moveTo(px[i] + 2, py[i]); ctx.arc(px[i], py[i], 2, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // ================= UI overlay =================
  const $ = id => document.getElementById(id);
  const genEl = $('gen'), bestEl = $('best'), reachedEl = $('reached'), aliveEl = $('alive');
  const barEl = $('bar'), timerEl = $('timer');

  function updateUI() {
    let alive = 0;
    for (let i = 0; i < POP; i++) if (state[i] === 0) alive++;
    genEl.textContent = generation;
    bestEl.textContent = bestScore.toFixed(1);
    reachedEl.textContent = reachedCount;
    aliveEl.textContent = alive;
    barEl.style.width = (step / LIFE * 100).toFixed(2) + '%';
    timerEl.textContent = `${(step * STEP_DT).toFixed(1)}s / ${(LIFE * STEP_DT).toFixed(1)}s`;
  }

  const chart = $('chart');
  const cctx = chart.getContext('2d');
  function resizeChart() {
    const r = chart.getBoundingClientRect();
    chart.width = Math.max(1, Math.floor(r.width * dpr));
    chart.height = Math.max(1, Math.floor(r.height * dpr));
    drawChart();
  }
  function drawChart() {
    const w = chart.width, h = chart.height;
    cctx.clearRect(0, 0, w, h);
    cctx.strokeStyle = 'rgba(255,255,255,0.08)';
    cctx.lineWidth = 1;
    cctx.beginPath(); cctx.moveTo(0, h * (1 - 100 / 150)); cctx.lineTo(w, h * (1 - 100 / 150)); cctx.stroke();
    if (history.length < 2) return;
    const xs = i => (i / (history.length - 1)) * w;
    const ys = v => h - 2 - (v / 150) * (h - 4);
    const fill = cctx.createLinearGradient(0, 0, 0, h);
    fill.addColorStop(0, 'rgba(255, 43, 214, 0.35)');
    fill.addColorStop(1, 'rgba(255, 43, 214, 0)');
    cctx.beginPath();
    cctx.moveTo(0, h);
    history.forEach((v, i) => cctx.lineTo(xs(i), ys(v)));
    cctx.lineTo(w, h);
    cctx.fillStyle = fill;
    cctx.fill();
    const line = cctx.createLinearGradient(0, 0, w, 0);
    line.addColorStop(0, '#00f0ff'); line.addColorStop(1, '#ff2bd6');
    cctx.beginPath();
    history.forEach((v, i) => (i ? cctx.lineTo(xs(i), ys(v)) : cctx.moveTo(xs(i), ys(v))));
    cctx.strokeStyle = line;
    cctx.lineWidth = 2 * dpr;
    cctx.stroke();
  }

  const toast = $('toast');
  let toastTimer;
  function showToast(gen, hits) {
    toast.innerHTML = hits
      ? `<span class="gen">Generation ${gen}</span> · <span class="hit">${hits} reached the target</span>`
      : `<span class="gen">Generation ${gen}</span> · evolving…`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    drawChart();
  }

  // ================= Controls =================
  let paused = false, speedIdx = 0;
  const SPEEDS = [1, 2, 4];
  const speedBtn = $('speedBtn'), pauseBtn = $('pauseBtn');
  function cycleSpeed() {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    speedBtn.textContent = `Speed ${SPEEDS[speedIdx]}×`;
  }
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  }
  function clearWalls() { walls = []; trailClear = true; }
  speedBtn.onclick = cycleSpeed;
  pauseBtn.onclick = togglePause;
  $('clearBtn').onclick = clearWalls;
  $('resetBtn').onclick = resetAI;

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'c' || e.key === 'C') clearWalls();
    else if (e.key === 'r' || e.key === 'R') resetAI();
    else if (e.key === 's' || e.key === 'S') cycleSpeed();
  });

  // ================= Drawing walls with the mouse =================
  let mode = null, lastX = 0, lastY = 0;
  function toWorld(e) {
    return [(e.clientX - offX) / scale, (e.clientY - offY) / scale];
  }
  function eraseAt(x, y) {
    const before = walls.length;
    walls = walls.filter(s => distToSegSq(x, y, s) > 28 * 28);
    if (walls.length !== before) trailClear = true;
  }
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    [lastX, lastY] = toWorld(e);
    if (e.button === 2) { mode = 'erase'; eraseAt(lastX, lastY); }
    else {
      mode = 'draw';
      walls.push({ x1: lastX, y1: lastY, x2: lastX + 0.01, y2: lastY }); // a dot is a wall too
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!mode) return;
    const [x, y] = toWorld(e);
    if (mode === 'erase') { eraseAt(x, y); return; }
    if (Math.hypot(x - lastX, y - lastY) < 6) return;
    walls.push({ x1: lastX, y1: lastY, x2: x, y2: y });
    lastX = x; lastY = y;
  });
  const endStroke = () => { mode = null; };
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  // ================= Main loop (fixed timestep) =================
  let lastTime = performance.now(), accumulator = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;
    if (!paused) {
      accumulator += dt * SPEEDS[speedIdx];
      let steps = 0;
      while (accumulator >= STEP_DT && steps < 12) {
        simulate();
        accumulator -= STEP_DT;
        steps++;
        if (steps > 1) render(now); // keep trails continuous at higher speeds
      }
      if (steps > 1) { updateUI(); requestAnimationFrame(loop); return; }
    }
    render(now);
    updateUI();
    requestAnimationFrame(loop);
  }

  defaultWalls();
  resetAI();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
