<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Evolution</title>
<style>
  :root {
    --bg: #0B0C10;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --violet: #b026ff;
    --green: #39ff14;
    --text: #e6f7ff;
    --muted: #7d8aa3;
    --glass: rgba(18, 20, 30, 0.62);
    --edge: rgba(0, 240, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
  }
  .glass {
    background: var(--glass);
    border: 1px solid var(--edge);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 14px;
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.08), inset 0 0 0 1px rgba(255,255,255,0.03);
  }

  /* ---------- Stats panel ---------- */
  .panel {
    position: fixed; top: 16px; left: 16px;
    width: 310px; padding: 16px 18px;
  }
  .title {
    margin: 0 0 12px;
    font-size: 1.05rem; font-weight: 800; letter-spacing: 0.18em;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.45));
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .stat .label {
    font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .stat .value {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .stat .value.cyan { color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6); }
  .stat .value.magenta { color: var(--magenta); text-shadow: 0 0 10px rgba(255,43,214,0.6); }
  .stat .value.green { color: var(--green); text-shadow: 0 0 10px rgba(57,255,20,0.5); }

  .progress-wrap { margin-top: 14px; }
  .progress-head {
    display: flex; justify-content: space-between;
    font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-head span:last-child { font-family: ui-monospace, Consolas, monospace; letter-spacing: 0; }
  .progress {
    height: 8px; border-radius: 99px; overflow: hidden;
    background: rgba(255,255,255,0.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .progress-bar {
    height: 100%; width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    box-shadow: 0 0 12px rgba(255, 43, 214, 0.7);
  }
  .chart-label {
    margin-top: 14px; margin-bottom: 4px;
    font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .chart-label { display: flex; justify-content: space-between; align-items: center; }
  .chart-label .live {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--green); letter-spacing: 0.1em;
  }
  .chart-label .live::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  #chart {
    position: static; width: 100%; height: 140px; cursor: default;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(0,240,255,0.04), rgba(255,43,214,0.03));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .select {
    appearance: none; -webkit-appearance: none;
    padding: 8px 30px 8px 14px; border-radius: 9px;
    border: 1px solid rgba(0,240,255,0.35);
    background:
      linear-gradient(45deg, transparent 50%, var(--cyan) 50%) right 15px center / 5px 5px no-repeat,
      linear-gradient(-45deg, transparent 50%, var(--cyan) 50%) right 10px center / 5px 5px no-repeat,
      rgba(0,240,255,0.07);
    color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: box-shadow 0.2s;
  }
  .select:hover, .select:focus { outline: none; box-shadow: 0 0 14px rgba(0,240,255,0.35); }
  .select option { background: #12141e; color: var(--text); }

  /* ---------- Buttons ---------- */
  .corner {
    position: fixed; top: 16px; right: 16px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    color: var(--text); text-decoration: none;
    font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
  }
  .corner:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 179, 71, 0.6);
    box-shadow: 0 0 22px rgba(255, 179, 71, 0.3);
  }
  .corner .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ffb347; box-shadow: 0 0 10px #ffb347;
  }
  .controls {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 8px; padding: 8px;
  }
  .btn {
    padding: 8px 14px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .btn:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,240,255,0.35); }
  .btn.danger:hover { border-color: var(--magenta); box-shadow: 0 0 14px rgba(255,43,214,0.35); }
  .hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    padding: 9px 16px; font-size: 0.8rem; color: var(--muted); white-space: nowrap;
  }
  .hint b { color: var(--text); font-weight: 600; }

  /* ---------- Generation toast ---------- */
  .toast {
    position: fixed; top: 22px; left: 50%;
    transform: translate(-50%, -20px);
    padding: 10px 20px; font-size: 0.9rem; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s, transform 0.35s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .gen { color: var(--cyan); }
  .toast .hit { color: var(--green); }

  @media (max-width: 760px) {
    .panel { width: auto; right: 16px; padding: 12px 14px; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat .value { font-size: 1rem; }
    #chart, .chart-label { display: none; }
    .corner { top: auto; bottom: 72px; right: 16px; }
    .hint { display: none; }
    .controls { left: 16px; justify-content: center; flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <canvas id="world"></canvas>
  <div class="vignette"></div>

  <div class="panel glass">
    <h1 class="title">NEON EVOLUTION</h1>
    <div class="stats">
      <div class="stat"><div class="label">Generation</div><div class="value cyan" id="gen">1</div></div>
      <div class="stat"><div class="label">Best Fitness</div><div class="value magenta" id="best">0.0</div></div>
      <div class="stat"><div class="label">Reached</div><div class="value green" id="reached">0</div></div>
      <div class="stat"><div class="label">Alive</div><div class="value" id="alive">0</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-head"><span>Generation timer</span><span id="timer">0.0s</span></div>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
    </div>
    <div class="chart-label"><span>Evolution analytics</span><span class="live">LIVE</span></div>
    <canvas id="chart"></canvas>
  </div>

  <a class="corner glass" href="sand.html"><span class="dot"></span>Play Falling Sand</a>

  <div class="hint glass">
    <b>Drag</b> to draw walls · <b>Right-drag</b> to erase · <b>1–5</b> presets · <b>Space</b> pause · <b>C</b> clear · <b>R</b> restart
  </div>

  <div class="controls glass">
    <select class="select" id="presetSel" title="Load an obstacle course">
      <option value="" selected disabled>Presets</option>
      <option value="bar">1 · Classic Bar</option>
      <option value="trap">2 · U-Shape Trap</option>
      <option value="maze">3 · Random Maze</option>
      <option value="asteroids">4 · Asteroid Field</option>
      <option value="empty">5 · Empty Arena</option>
    </select>
    <button class="btn" id="speedBtn">Speed 1×</button>
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn danger" id="clearBtn">Clear walls</button>
    <button class="btn danger" id="resetBtn">Restart AI</button>
  </div>

  <div class="toast glass" id="toast"></div>

<script>
(() => {
  // ================= Configuration =================
  const WW = 1600, WH = 900;          // logical world size (scaled to fit the screen)
  const POP = 300;                    // agents per generation
  const LIFE = 330;                   // simulation steps per generation (5.5 s at 60 steps/s)
  const STEP_DT = 1 / 60;
  const MAX_FORCE = 0.45;             // magnitude of each gene's thrust vector
  const MAX_SPEED = 7;
  const MUTATION = 0.012;             // chance each gene is replaced with a random one
  const ELITES = 4;                   // best agents copied unchanged into the next generation
  const WALL_HALF = 6;                // half-thickness of walls for collisions
  const AGENT_R = 2;

  const START = { x: WW / 2, y: WH - 60 };
  const TARGET = { x: WW / 2, y: 90, r: 24 };
  const START_DIST = Math.hypot(START.x - TARGET.x, START.y - TARGET.y);

  // ================= Population state =================
  // Each genome is LIFE thrust vectors stored as [x0, y0, x1, y1, ...]
  let genes = [];
  const px = new Float32Array(POP), py = new Float32Array(POP);
  const ox = new Float32Array(POP), oy = new Float32Array(POP);  // previous position (for trails)
  const vx = new Float32Array(POP), vy = new Float32Array(POP);
  const state = new Uint8Array(POP);      // 0 alive, 1 crashed, 2 reached target
  const minDist = new Float32Array(POP);
  const reachStep = new Int32Array(POP);
  const fitness = new Float64Array(POP);

  let generation = 1, step = 0, reachedCount = 0;
  let bestScore = 0, allTimeBest = 0;
  const history = [];

  function randomGene(g, k) {
    const a = Math.random() * Math.PI * 2;
    g[2 * k] = Math.cos(a) * MAX_FORCE;
    g[2 * k + 1] = Math.sin(a) * MAX_FORCE;
  }
  function randomGenome() {
    const g = new Float32Array(LIFE * 2);
    for (let k = 0; k < LIFE; k++) randomGene(g, k);
    return g;
  }

  function spawn() {
    for (let i = 0; i < POP; i++) {
      px[i] = ox[i] = START.x; py[i] = oy[i] = START.y;
      vx[i] = vy[i] = 0;
      state[i] = 0;
      minDist[i] = START_DIST;
      reachStep[i] = LIFE;
    }
    step = 0;
    reachedCount = 0;
  }

  function resetAI() {
    genes = Array.from({ length: POP }, randomGenome);
    generation = 1; bestScore = 0; allTimeBest = 0;
    history.length = 0;
    spawn();
    trailClear = true;
  }

  // ================= Walls =================
  // Line segments drawn by the user: {x1, y1, x2, y2}
  let walls = [];
  function defaultWalls() {
    walls = PRESETS.bar.build();
  }

  // ================= Obstacle course presets =================
  const seg = (x1, y1, x2, y2) => ({ x1, y1, x2, y2 });
  const rnd = (a, b) => a + Math.random() * (b - a);

  // A full-width barrier at height y with openings at the given x-centres
  function barrierWithGaps(y, gapCentres, gapW) {
    const out = [];
    let x = 0;
    for (const c of gapCentres.sort((a, b) => a - b)) {
      if (c - gapW / 2 > x) out.push(seg(x, y, c - gapW / 2, y));
      x = c + gapW / 2;
    }
    if (x < WW) out.push(seg(x, y, WW, y));
    return out;
  }

  // A closed polygon (used for asteroid rocks)
  function rock(cx, cy, r) {
    const n = 7 + ((Math.random() * 4) | 0), pts = [];
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2, rr = r * rnd(0.65, 1.1);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    return pts.map((p, k) => seg(p[0], p[1], pts[(k + 1) % n][0], pts[(k + 1) % n][1]));
  }

  const PRESETS = {
    bar: { name: 'Classic Bar', build: () => [seg(560, 470, 1040, 470)] },
    trap: {
      name: 'U-Shape Trap',
      build: () => [
        seg(520, 330, 1080, 330),    // roof of the cup facing the agents
        seg(520, 330, 520, 610),
        seg(1080, 330, 1080, 610),
        seg(250, 200, 420, 200),     // side deflectors
        seg(1180, 200, 1350, 200),
      ],
    },
    maze: {
      name: 'Random Maze',
      build: () => {
        const out = [];
        const rows = [300, 560];
        const flip = Math.random() < 0.5;
        rows.forEach((y, r) => {
          // three random openings per row; the middle ones are offset so there is no straight shot
          const mid = (r === 0) === flip ? rnd(640, 720) : rnd(880, 960);
          const gaps = [rnd(200, 420), mid, rnd(1180, 1400)];
          out.push(...barrierWithGaps(y, gaps, 210));
          // vertical stubs hanging below each row make the corridors twistier
          const nextY = rows[r + 1] ?? 780;
          for (let k = 0; k < 3; k++) {
            const x = (gaps[k] + (gaps[k + 1] ?? WW - 60)) / 2 + rnd(-60, 60);
            out.push(seg(x, y, x, y + (nextY - y) * rnd(0.3, 0.5)));
          }
        });
        return out;
      },
    },
    asteroids: {
      name: 'Asteroid Field',
      build: () => {
        const out = [], placed = [];
        let tries = 0;
        while (placed.length < 22 && tries++ < 600) {
          const x = rnd(80, WW - 80), y = rnd(190, WH - 170), r = rnd(22, 48);
          if (placed.some(p => Math.hypot(p.x - x, p.y - y) < p.r + r + 55)) continue;
          if (Math.hypot(x - START.x, y - START.y) < 160) continue;
          placed.push({ x, y, r });
          out.push(...rock(x, y, r));
        }
        return out;
      },
    },
    empty: { name: 'Empty Arena', build: () => [] },
  };

  function loadPreset(key) {
    const p = PRESETS[key];
    if (!p) return;
    walls = p.build();
    trailClear = true;
    announce(`<span class="gen">Preset loaded</span> · ${p.name}`);
  }

  function distToSegSq(x, y, s) {
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const len = dx * dx + dy * dy;
    let t = len ? ((x - s.x1) * dx + (y - s.y1) * dy) / len : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = s.x1 + t * dx - x, cy = s.y1 + t * dy - y;
    return cx * cx + cy * cy;
  }

  const HIT_SQ = (WALL_HALF + AGENT_R) ** 2;
  function hitsWall(x, y) {
    for (let w = 0; w < walls.length; w++) {
      const s = walls[w];
      // cheap bounding-box reject before the exact test
      if (x < Math.min(s.x1, s.x2) - 10 || x > Math.max(s.x1, s.x2) + 10 ||
          y < Math.min(s.y1, s.y2) - 10 || y > Math.max(s.y1, s.y2) + 10) continue;
      if (distToSegSq(x, y, s) < HIT_SQ) return true;
    }
    return false;
  }

  // ================= Physics step =================
  function simulate() {
    const k2 = step * 2;
    for (let i = 0; i < POP; i++) {
      if (state[i] !== 0) continue;
      const g = genes[i];
      ox[i] = px[i]; oy[i] = py[i];
      vx[i] += g[k2]; vy[i] += g[k2 + 1];
      const sp = Math.hypot(vx[i], vy[i]);
      if (sp > MAX_SPEED) { vx[i] *= MAX_SPEED / sp; vy[i] *= MAX_SPEED / sp; }
      px[i] += vx[i]; py[i] += vy[i];

      if (px[i] < 0 || px[i] > WW || py[i] < 0 || py[i] > WH || hitsWall(px[i], py[i])) {
        state[i] = 1;
        continue;
      }
      const d = Math.hypot(px[i] - TARGET.x, py[i] - TARGET.y);
      if (d < minDist[i]) minDist[i] = d;
      if (d < TARGET.r) {
        state[i] = 2;
        reachStep[i] = step;
        minDist[i] = 0;
        reachedCount++;
      }
    }
    step++;

    let alive = 0;
    for (let i = 0; i < POP; i++) if (state[i] === 0) alive++;
    if (step >= LIFE || alive === 0) evolve();
  }

  // ================= Genetic algorithm =================
  // Score shown in the UI: 0-100 for how close the agent got, up to 150 if it reached
  // the target (faster arrivals earn more).
  function scoreOf(i) {
    if (state[i] === 2) return 100 + 50 * (1 - reachStep[i] / LIFE);
    return 100 * Math.max(0, 1 - minDist[i] / START_DIST);
  }

  function evolve() {
    // 1. Evaluate fitness
    let total = 0;
    bestScore = 0;
    for (let i = 0; i < POP; i++) {
      const s = scoreOf(i);
      if (s > bestScore) bestScore = s;
      let f = Math.pow(s / 100, 4);          // sharpen: small gains near the goal matter a lot
      if (state[i] === 1) f *= 0.5;          // crashing is penalised
      fitness[i] = f;
      total += f;
    }
    allTimeBest = Math.max(allTimeBest, bestScore);
    history.push(bestScore);
    if (history.length > 120) history.shift();
    chartAnimStart = performance.now();
    showToast(generation, reachedCount);

    // 2. Elitism: keep the very best genomes as-is
    const order = Array.from({ length: POP }, (_, i) => i).sort((a, b) => fitness[b] - fitness[a]);
    const next = [];
    for (let e = 0; e < ELITES; e++) next.push(genes[order[e]].slice());

    // 3. Roulette-wheel selection over cumulative fitness
    const cumulative = new Float64Array(POP);
    let acc = 0;
    for (let i = 0; i < POP; i++) { acc += fitness[i]; cumulative[i] = acc; }
    function pick() {
      if (total <= 0) return genes[(Math.random() * POP) | 0];
      const r = Math.random() * total;
      let lo = 0, hi = POP - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cumulative[mid] < r) lo = mid + 1; else hi = mid;
      }
      return genes[lo];
    }

    // 4. Crossover + mutation
    while (next.length < POP) {
      const a = pick(), b = pick();
      const child = new Float32Array(LIFE * 2);
      const cut = ((Math.random() * LIFE) | 0) * 2;   // single-point crossover
      child.set(a.subarray(0, cut), 0);
      child.set(b.subarray(cut), cut);
      for (let k = 0; k < LIFE; k++) if (Math.random() < MUTATION) randomGene(child, k);
      next.push(child);
    }

    genes = next;
    generation++;
    spawn();
  }

  // ================= Rendering =================
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  let dpr = 1, scale = 1, offX = 0, offY = 0, trailClear = true;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    scale = Math.min(innerWidth / WW, innerHeight / WH);
    offX = (innerWidth - WW * scale) / 2;
    offY = (innerHeight - WH * scale) / 2;
    trailClear = true;
    resizeChart();
  }
  window.addEventListener('resize', resize);

  function worldTransform() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  }

  // ---------- Quantum portal (the goal) ----------
  const TAU = Math.PI * 2;
  const PORTAL_OUTER = 130;
  function newMote(anywhere) {
    return {
      a: Math.random() * TAU,
      r: anywhere ? rnd(TARGET.r, PORTAL_OUTER) : rnd(PORTAL_OUTER * 0.8, PORTAL_OUTER),
      s: rnd(0.5, 1.4),
      c: Math.random() < 0.5 ? 0 : 1,
    };
  }
  const motes = Array.from({ length: 110 }, () => newMote(true));
  const RING_COLORS = ['0, 240, 255', '255, 43, 214', '176, 38, 255'];

  function drawPortal(time) {
    const t = time / 1000;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3.2);
    ctx.save();
    ctx.translate(TARGET.x, TARGET.y);
    ctx.globalCompositeOperation = 'lighter';

    // Gravitational glow
    const glow = ctx.createRadialGradient(0, 0, TARGET.r * 0.5, 0, 0, PORTAL_OUTER * (1 + pulse * 0.15));
    glow.addColorStop(0, 'rgba(176, 38, 255, 0.45)');
    glow.addColorStop(0.4, 'rgba(255, 43, 214, 0.12)');
    glow.addColorStop(1, 'rgba(0, 240, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, PORTAL_OUTER * 1.2, 0, TAU); ctx.fill();

    // Spiral arms winding into the core
    ctx.lineWidth = 2;
    for (let arm = 0; arm < 4; arm++) {
      ctx.strokeStyle = `rgba(${RING_COLORS[arm % 2]}, 0.22)`;
      ctx.beginPath();
      for (let k = 0; k <= 40; k++) {
        const f = k / 40;
        const r = TARGET.r + f * (PORTAL_OUTER - TARGET.r);
        const a = arm * (TAU / 4) - t * 1.6 + f * 3.4;
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }

    // Particles spiralling inward, speeding up as they fall
    for (let c = 0; c < 2; c++) {
      ctx.strokeStyle = `rgba(${RING_COLORS[c]}, 0.9)`;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (const m of motes) {
        if (c === 0) {
          const pull = PORTAL_OUTER / m.r;
          m.a += 0.012 * m.s * pull;
          m.r -= 0.28 * m.s * pull;
          if (m.r < TARGET.r * 0.85) Object.assign(m, newMote(false));
        }
        if (m.c !== c) continue;
        const len = Math.min(0.5, 6 / m.r);
        ctx.moveTo(Math.cos(m.a - len) * m.r, Math.sin(m.a - len) * m.r);
        ctx.arc(0, 0, m.r, m.a - len, m.a);
      }
      ctx.stroke();
    }

    // Counter-rotating segmented rings
    ctx.shadowBlur = 14;
    for (let k = 0; k < 3; k++) {
      const r = TARGET.r + 14 + k * 17 + pulse * (3 - k);
      const rot = t * (k % 2 ? -1 : 1) * (1.4 - k * 0.3);
      const pieces = 3 + k;
      ctx.strokeStyle = `rgba(${RING_COLORS[k]}, ${0.75 - k * 0.15})`;
      ctx.shadowColor = `rgb(${RING_COLORS[k]})`;
      ctx.lineWidth = 3 - k * 0.6;
      for (let p = 0; p < pieces; p++) {
        const a0 = rot + (p / pieces) * TAU;
        ctx.beginPath();
        ctx.arc(0, 0, r, a0, a0 + (TAU / pieces) * 0.6);
        ctx.stroke();
      }
    }

    // Event horizon: black core with a blazing rim
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, TARGET.r);
    core.addColorStop(0, '#000');
    core.addColorStop(0.75, '#05020a');
    core.addColorStop(1, 'rgba(60, 10, 90, 1)');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(0, 0, TARGET.r, 0, TAU); ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 18 + pulse * 14;
    ctx.strokeStyle = `rgba(220, 250, 255, ${0.7 + pulse * 0.3})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, TARGET.r + pulse * 2, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function render(time) {
    // Fade the previous frame instead of clearing: this leaves light trails behind agents
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = trailClear ? '#0B0C10' : 'rgba(11, 12, 16, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    trailClear = false;

    worldTransform();

    // Arena border
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, WW - 2, WH - 2);

    // Start pad
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(START.x, START.y, 14, 0, Math.PI * 2); ctx.stroke();

    drawPortal(time);

    // Walls: violet glow with a bright core
    if (walls.length) {
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (const s of walls) { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
      ctx.shadowColor = '#b026ff';
      ctx.shadowBlur = 22;
      ctx.strokeStyle = 'rgba(176, 38, 255, 0.9)';
      ctx.lineWidth = WALL_HALF * 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(245, 225, 255, 0.95)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Agents: additive blending makes overlapping trails glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const groups = [
      { color: 'rgba(0, 240, 255, 0.85)',  glow: 'rgba(0, 240, 255, 0.10)',  parity: 0 },
      { color: 'rgba(255, 43, 214, 0.85)', glow: 'rgba(255, 43, 214, 0.10)', parity: 1 },
    ];
    for (const grp of groups) {
      // trail segment for this step
      ctx.strokeStyle = grp.color;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      for (let i = ELITES + grp.parity; i < POP; i += 2) {
        if (state[i] !== 0) continue;
        ctx.moveTo(ox[i], oy[i]); ctx.lineTo(px[i], py[i]);
      }
      ctx.stroke();
      // soft halo around each head
      ctx.fillStyle = grp.glow;
      ctx.beginPath();
      for (let i = ELITES + grp.parity; i < POP; i += 2) {
        if (state[i] === 1) continue;
        ctx.moveTo(px[i] + 7, py[i]); ctx.arc(px[i], py[i], 7, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    // Elites (last generation's champions) shine white
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < ELITES; i++) {
      if (state[i] !== 0) continue;
      ctx.moveTo(ox[i], oy[i]); ctx.lineTo(px[i], py[i]);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < ELITES; i++) {
      if (state[i] === 1) continue;
      ctx.moveTo(px[i] + 9, py[i]); ctx.arc(px[i], py[i], 9, 0, Math.PI * 2);
    }
    ctx.fill();
    // Crash sparks
    ctx.fillStyle = 'rgba(255, 90, 120, 0.35)';
    ctx.beginPath();
    for (let i = 0; i < POP; i++) {
      if (state[i] !== 1) continue;
      ctx.moveTo(px[i] + 2, py[i]); ctx.arc(px[i], py[i], 2, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // ================= UI overlay =================
  const $ = id => document.getElementById(id);
  const genEl = $('gen'), bestEl = $('best'), reachedEl = $('reached'), aliveEl = $('alive');
  const barEl = $('bar'), timerEl = $('timer');

  function updateUI() {
    let alive = 0;
    for (let i = 0; i < POP; i++) if (state[i] === 0) alive++;
    genEl.textContent = generation;
    bestEl.textContent = bestScore.toFixed(1);
    reachedEl.textContent = reachedCount;
    aliveEl.textContent = alive;
    barEl.style.width = (step / LIFE * 100).toFixed(2) + '%';
    timerEl.textContent = `${(step * STEP_DT).toFixed(1)}s / ${(LIFE * STEP_DT).toFixed(1)}s`;
  }

  const chart = $('chart');
  const cctx = chart.getContext('2d');
  function resizeChart() {
    const r = chart.getBoundingClientRect();
    chart.width = Math.max(1, Math.floor(r.width * dpr));
    chart.height = Math.max(1, Math.floor(r.height * dpr));
    drawChart(performance.now());
  }
  let chartAnimStart = 0;
  // Best score of the generation that is currently running (for the live point)
  function liveBest() {
    let b = 0;
    for (let i = 0; i < POP; i++) { const v = scoreOf(i); if (v > b) b = v; }
    return b;
  }

  function drawChart(now) {
    const w = chart.width, h = chart.height, d = dpr;
    const padL = 26 * d, padR = 10 * d, padT = 10 * d, padB = 16 * d;
    const pw = w - padL - padR, ph = h - padT - padB;
    const MAXY = 150;
    const ys = v => padT + ph - (Math.min(v, MAXY) / MAXY) * ph;
    cctx.setTransform(1, 0, 0, 1, 0, 0);
    cctx.clearRect(0, 0, w, h);
    cctx.font = `${9 * d}px ui-monospace, Consolas, monospace`;
    cctx.textBaseline = 'middle';

    // Grid and y-axis labels
    for (const v of [0, 50, 100, 150]) {
      const y = ys(v);
      cctx.strokeStyle = v === 100 ? 'rgba(57, 255, 20, 0.35)' : 'rgba(255, 255, 255, 0.07)';
      cctx.setLineDash(v === 100 ? [4 * d, 4 * d] : []);
      cctx.lineWidth = d;
      cctx.beginPath(); cctx.moveTo(padL, y); cctx.lineTo(w - padR, y); cctx.stroke();
      cctx.fillStyle = v === 100 ? 'rgba(57, 255, 20, 0.8)' : 'rgba(125, 138, 163, 0.9)';
      cctx.textAlign = 'right';
      cctx.fillText(v, padL - 5 * d, y);
    }
    cctx.setLineDash([]);
    cctx.textAlign = 'right';
    cctx.fillStyle = 'rgba(57, 255, 20, 0.6)';
    cctx.fillText('TARGET', w - padR - 2 * d, ys(100) - 7 * d);

    // Points: finished generations plus the generation currently running
    const pts = history.slice();
    const live = liveBest();
    const n = pts.length + 1;               // include live point
    const firstGen = generation - pts.length;
    const xs = i => padL + (n <= 1 ? pw : (i / (n - 1)) * pw);

    // X-axis labels
    cctx.fillStyle = 'rgba(125, 138, 163, 0.9)';
    cctx.textAlign = 'left';
    cctx.fillText(`gen ${firstGen}`, padL, h - padB / 2);
    cctx.textAlign = 'right';
    cctx.fillText(`gen ${generation}`, w - padR, h - padB / 2);

    if (pts.length) {
      // The newest point eases in from the previous one
      const k = Math.min(1, (now - chartAnimStart) / 450);
      const ease = 1 - Math.pow(1 - k, 3);
      const coords = pts.map((v, i) => [xs(i), ys(v)]);
      if (coords.length > 1) {
        const last = coords.length - 1, prev = coords[last - 1];
        coords[last] = [prev[0] + (coords[last][0] - prev[0]) * ease, prev[1] + (coords[last][1] - prev[1]) * ease];
      }

      // Area under the curve
      const fill = cctx.createLinearGradient(0, padT, 0, padT + ph);
      fill.addColorStop(0, 'rgba(255, 43, 214, 0.32)');
      fill.addColorStop(1, 'rgba(0, 240, 255, 0)');
      cctx.beginPath();
      cctx.moveTo(coords[0][0], padT + ph);
      for (const [x, y] of coords) cctx.lineTo(x, y);
      cctx.lineTo(coords[coords.length - 1][0], padT + ph);
      cctx.closePath();
      cctx.fillStyle = fill;
      cctx.fill();

      // Glowing neon line
      const line = cctx.createLinearGradient(padL, 0, w - padR, 0);
      line.addColorStop(0, '#00f0ff');
      line.addColorStop(1, '#ff2bd6');
      cctx.strokeStyle = line;
      cctx.lineJoin = 'round';
      cctx.lineCap = 'round';
      cctx.shadowColor = '#ff2bd6';
      cctx.shadowBlur = 10 * d;
      cctx.lineWidth = 2.2 * d;
      cctx.beginPath();
      coords.forEach(([x, y], i) => (i ? cctx.lineTo(x, y) : cctx.moveTo(x, y)));
      cctx.stroke();
      cctx.shadowBlur = 0;

      // Dashed link to the live point
      const [lx, ly] = coords[coords.length - 1];
      cctx.setLineDash([3 * d, 3 * d]);
      cctx.strokeStyle = 'rgba(57, 255, 20, 0.6)';
      cctx.lineWidth = 1.2 * d;
      cctx.beginPath(); cctx.moveTo(lx, ly); cctx.lineTo(xs(n - 1), ys(live)); cctx.stroke();
      cctx.setLineDash([]);

      // Glowing dot on the latest finished generation
      cctx.fillStyle = '#ffffff';
      cctx.shadowColor = '#ff2bd6';
      cctx.shadowBlur = 12 * d;
      cctx.beginPath(); cctx.arc(lx, ly, 3 * d, 0, TAU); cctx.fill();
      cctx.shadowBlur = 0;
    }

    // Pulsing live point for the running generation
    const pulse = 0.5 + 0.5 * Math.sin(now / 180);
    const x = xs(n - 1), y = ys(live);
    cctx.fillStyle = `rgba(57, 255, 20, ${0.15 + pulse * 0.2})`;
    cctx.beginPath(); cctx.arc(x, y, (5 + pulse * 3) * d, 0, TAU); cctx.fill();
    cctx.fillStyle = '#39ff14';
    cctx.beginPath(); cctx.arc(x, y, 2.5 * d, 0, TAU); cctx.fill();

    // Value label beside the live point
    cctx.fillStyle = '#e6f7ff';
    cctx.textAlign = 'right';
    cctx.fillText(live.toFixed(1), x - 8 * d, Math.max(padT + 5 * d, y - 9 * d));
  }

  const toast = $('toast');
  let toastTimer;
  function announce(html) {
    toast.innerHTML = html;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }
  function showToast(gen, hits) {
    announce(hits
      ? `<span class="gen">Generation ${gen}</span> · <span class="hit">${hits} reached the target</span>`
      : `<span class="gen">Generation ${gen}</span> · evolving…`);
  }

  // ================= Controls =================
  let paused = false, speedIdx = 0;
  const SPEEDS = [1, 2, 4];
  const speedBtn = $('speedBtn'), pauseBtn = $('pauseBtn');
  function cycleSpeed() {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    speedBtn.textContent = `Speed ${SPEEDS[speedIdx]}×`;
  }
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  }
  function clearWalls() { walls = []; trailClear = true; }
  speedBtn.onclick = cycleSpeed;
  pauseBtn.onclick = togglePause;
  $('clearBtn').onclick = clearWalls;
  $('resetBtn').onclick = resetAI;
  const presetSel = $('presetSel');
  presetSel.onchange = () => {
    loadPreset(presetSel.value);
    presetSel.value = '';      // allow picking the same preset again (e.g. a new random maze)
    presetSel.blur();
  };
  const PRESET_KEYS = { 1: 'bar', 2: 'trap', 3: 'maze', 4: 'asteroids', 5: 'empty' };

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (PRESET_KEYS[e.key]) loadPreset(PRESET_KEYS[e.key]);
    else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'c' || e.key === 'C') clearWalls();
    else if (e.key === 'r' || e.key === 'R') resetAI();
    else if (e.key === 's' || e.key === 'S') cycleSpeed();
  });

  // ================= Drawing walls with the mouse =================
  let mode = null, lastX = 0, lastY = 0;
  function toWorld(e) {
    return [(e.clientX - offX) / scale, (e.clientY - offY) / scale];
  }
  function eraseAt(x, y) {
    const before = walls.length;
    walls = walls.filter(s => distToSegSq(x, y, s) > 28 * 28);
    if (walls.length !== before) trailClear = true;
  }
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    [lastX, lastY] = toWorld(e);
    if (e.button === 2) { mode = 'erase'; eraseAt(lastX, lastY); }
    else {
      mode = 'draw';
      walls.push({ x1: lastX, y1: lastY, x2: lastX + 0.01, y2: lastY }); // a dot is a wall too
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!mode) return;
    const [x, y] = toWorld(e);
    if (mode === 'erase') { eraseAt(x, y); return; }
    if (Math.hypot(x - lastX, y - lastY) < 6) return;
    walls.push({ x1: lastX, y1: lastY, x2: x, y2: y });
    lastX = x; lastY = y;
  });
  const endStroke = () => { mode = null; };
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  // ================= Main loop (fixed timestep) =================
  let lastTime = performance.now(), accumulator = 0;
  function loop(now) {
    const dt = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;
    if (!paused) {
      accumulator += dt * SPEEDS[speedIdx];
      let steps = 0;
      while (accumulator >= STEP_DT && steps < 12) {
        simulate();
        accumulator -= STEP_DT;
        steps++;
        if (steps > 1) render(now); // keep trails continuous at higher speeds
      }
      if (steps > 1) { updateUI(); drawChart(now); requestAnimationFrame(loop); return; }
    }
    render(now);
    updateUI();
    drawChart(now);
    requestAnimationFrame(loop);
  }

  defaultWalls();
  resetAI();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
